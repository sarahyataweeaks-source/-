<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">บะหมี่กึ่งสำเร็จรูป</a>
      <nav>
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow">
        <div class="section__header">
          <h1>สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลสำหรับติดต่อกลับ แล้วกดยืนยันสั่งซื้อ</p>
        </div>

        <form id="orderForm">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input class="input" type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input class="input" type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea class="textarea" id="note" name="note" rows="4"></textarea>
          </div>

          <button type="submit" class="btn btn--primary mt-4">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>&copy; 2026 บะหมี่กึ่งสำเร็จรูป</span>
      <a href="product.html">กลับไปเลือกสินค้า</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
