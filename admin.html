<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">บะหมี่กึ่งสำเร็จรูป</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__header">
          <h1>รายการสั่งซื้อ</h1>
          <p id="status" aria-live="polite">กำลังโหลดข้อมูล...</p>
          <button type="button" id="refresh" class="btn mt-4">รีเฟรชข้อมูล</button>
        </div>

        <div class="table-wrap">
          <table id="ordersTable" class="data-table">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร / Line</th>
                <th>รายการสินค้า</th>
                <th class="num">จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
